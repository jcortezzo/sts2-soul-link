name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rules engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Only the rules engine and its tests build in CI. The mod project (SoulLink.csproj)
      # compiles against the game's own DLLs, which can't be redistributed.
      - name: Restore
        run: dotnet restore SoulLink.Core.Tests/SoulLink.Core.Tests.csproj

      - name: Build
        run: dotnet build SoulLink.Core.Tests/SoulLink.Core.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test SoulLink.Core.Tests/SoulLink.Core.Tests.csproj --configuration Release --no-build --verbosity normal
